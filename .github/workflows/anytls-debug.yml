name: SwiftNG AnyTLS Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - anytls
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/anytls-debug.yml'

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout core bindings (SwiftNG-core)
      uses: actions/checkout@v4
      with:
        repository: cien121/SwiftNG-core
        ref: main
        path: core-bindings

    - name: Checkout xray-core with AnyTLS patch
      uses: actions/checkout@v4
      with:
        repository: cien121/xray-core
        ref: aras-core-26.9.28
        path: xray-core-src

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android NDK
      run: |
        SDK=$HOME/android-sdk
        mkdir -p $SDK/cmdline-tools
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
        unzip -q /tmp/clt.zip -d $SDK/cmdline-tools
        mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
        yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
        $SDK/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" >/dev/null
        echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> $GITHUB_ENV

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init

    - name: Build core AAR (libv2ray.aar with AnyTLS)
      run: |
        cd core-bindings
        go mod edit -replace=github.com/xtls/xray-core=$GITHUB_WORKSPACE/xray-core-src
        go mod tidy
        gomobile bind -androidapi 24 -trimpath \
          -ldflags='-s -w -buildid= -checklinkname=0' \
          -o $GITHUB_WORKSPACE/libv2ray.aar ./

    - name: Verify AnyTLS in core
      run: |
        set -euo pipefail
        rm -rf /tmp/aarcheck && mkdir -p /tmp/aarcheck && cd /tmp/aarcheck
        unzip -o -q "$GITHUB_WORKSPACE/libv2ray.aar" "jni/arm64-v8a/libgojni.so"
        count=$(strings jni/arm64-v8a/libgojni.so | grep -ci "anytls" || true)
        echo "anytls symbol count: $count"
        [ "$count" -gt 0 ] || { echo "::error::AnyTLS support missing from core"; exit 1; }

    - name: Upload core AAR
      uses: actions/upload-artifact@v4
      with:
        name: libv2ray-anytls-aar
        path: libv2ray.aar
        retention-days: 7

  build-app:
    runs-on: ubuntu-latest
    needs: build-core
    steps:
    - name: Checkout code (anytls branch)
      uses: actions/checkout@v4
      with:
        ref: anytls
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Download AnyTLS core AAR
      uses: actions/download-artifact@v4
      with:
        name: libv2ray-anytls-aar
        path: aar-tmp

    - name: Place AAR into app libs
      run: |
        mkdir -p V2rayNG/app/libs
        cp aar-tmp/libv2ray.aar V2rayNG/app/libs/libv2ray.aar
        ls -lh V2rayNG/app/libs/

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app || true

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload arm64-v8a Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SwiftNG-anytls-arm64-v8a-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
        retention-days: 7
